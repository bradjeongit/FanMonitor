# ECblue configurator Windows 실행파일 빌드 -> Actions 실행 결과의 Artifacts 에서 ECBLUE_CONFIGURATOR 내려받기
# (예전 기존모터 시험기 ECBLUE_TESTER 를 바꾼 프로그램. main 에 반영되면 Release 의 옛 ECBLUE_TESTER.exe 는 지움)
# 파일 이름(build-tester-exe.yml)은 실행 기록을 잇고 브랜치에서 수동 실행할 수 있도록 그대로 둠
name: Build ECblue configurator exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/ecblue_configurator.py'
      - 'tools/motor_scanner.py'
      - 'motor_monitor/modbus.py'
      - 'ecblue_configurator.spec'
      - 'tests/test_configurator.py'
      - '.github/workflows/build-tester-exe.yml'

# exe 를 Release 'exe-latest' 에 올리기 위한 권한 (update.bat 이 로그인 없이 여기서 내려받음)
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests/test_configurator.py tests/test_core.py
      - name: Build
        run: python -m PyInstaller --noconfirm ecblue_configurator.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ECBLUE_CONFIGURATOR
          path: dist/ECBLUE_CONFIGURATOR.exe
          retention-days: 30
      - name: Publish to release exe-latest (update.bat downloads from here)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          gh release view exe-latest --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create exe-latest --repo $repo --target main --title "최신 실행파일 (update.bat 용)" `
              --notes "main 에 반영될 때마다 GitHub Actions 가 실행파일을 자동으로 교체합니다. 프로그램 폴더의 update.bat 이 여기서 내려받습니다."
            if ($LASTEXITCODE -ne 0) {
              # 다른 빌드가 동시에 만들었을 수 있음
              Start-Sleep -Seconds 5
              gh release view exe-latest --repo $repo *> $null
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
          }
          gh release upload exe-latest dist/ECBLUE_CONFIGURATOR.exe --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 이름이 바뀐 옛 시험기 파일 정리 (없으면 그냥 넘어감)
          gh release delete-asset exe-latest ECBLUE_TESTER.exe --repo $repo --yes 2>$null
          exit 0
