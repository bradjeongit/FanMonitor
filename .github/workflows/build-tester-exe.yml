# 기존모터 시험기 Windows 실행파일 빌드 -> Actions 실행 결과의 Artifacts 에서 ECBLUE_TESTER 내려받기
name: Build ECblue tester exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/ecblue_tester.py'
      - 'motor_monitor/modbus.py'
      - 'ecblue_tester.spec'
      - '.github/workflows/build-tester-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests/test_tester.py tests/test_core.py
      - name: Build
        run: python -m PyInstaller --noconfirm ecblue_tester.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ECBLUE_TESTER
          path: dist/ECBLUE_TESTER.exe
          retention-days: 30
