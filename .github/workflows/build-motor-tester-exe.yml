# 모터 시험기(SUNINUS MOTOR TEST) Windows 실행파일 빌드 -> Actions 실행 결과의 Artifacts 에서 MOTOR_TESTER 내려받기
name: Build motor tester exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/motor_tester.py'
      - 'motor_monitor/modbus.py'
      - 'motor_tester.spec'
      - 'tests/test_motor_tester.py'
      - '.github/workflows/build-motor-tester-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests/test_motor_tester.py tests/test_core.py
      - name: Build
        run: python -m PyInstaller --noconfirm motor_tester.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MOTOR_TESTER
          path: dist/MOTOR_TESTER.exe
          retention-days: 30
