# 모터 스캐너 Windows 실행파일 빌드 -> Actions 실행 결과의 Artifacts 에서 MOTOR_SCANNER 내려받기
name: Build motor scanner exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/motor_scanner.py'
      - 'motor_monitor/modbus.py'
      - 'motor_monitor/simulator.py'
      - 'motor_scanner.spec'
      - 'tests/test_motor_scanner.py'
      - '.github/workflows/build-motor-scanner-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests/test_motor_scanner.py tests/test_core.py
      - name: Build
        run: python -m PyInstaller --noconfirm motor_scanner.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MOTOR_SCANNER
          path: dist/MOTOR_SCANNER.exe
          retention-days: 30
